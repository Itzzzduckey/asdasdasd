<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Launch Tracker - NASA & SpaceX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4a 50%, #0f1b4a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid rgba(100, 200, 255, 0.3);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #64c8ff;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a0a0c0;
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            border: 2px solid #64c8ff;
            background: rgba(100, 200, 255, 0.1);
            color: #64c8ff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(100, 200, 255, 0.2);
            box-shadow: 0 0 15px rgba(100, 200, 255, 0.4);
        }

        button.active {
            background: #64c8ff;
            color: #0a0e27;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            color: #a0a0c0;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 8px;
        }

        .status-upcoming {
            background: rgba(100, 200, 255, 0.3);
            color: #64c8ff;
        }

        .status-recent {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .launches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .launch-card {
            background: rgba(30, 40, 80, 0.8);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .launch-card:hover {
            border-color: rgba(100, 200, 255, 0.6);
            box-shadow: 0 8px 32px rgba(100, 200, 255, 0.2);
            transform: translateY(-5px);
        }

        .launch-card.spacex {
            border-left: 4px solid #ff5e3b;
        }

        .launch-card.nasa {
            border-left: 4px solid #0b3d91;
        }

        .rocket-name {
            font-size: 1.4em;
            font-weight: 700;
            color: #64c8ff;
            margin-bottom: 8px;
        }

        .mission-name {
            color: #a0a0c0;
            font-size: 0.95em;
            margin-bottom: 12px;
        }

        .agency {
            display: inline-block;
            font-size: 0.8em;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .agency.spacex {
            background: rgba(255, 94, 59, 0.2);
            color: #ff5e3b;
        }

        .agency.nasa {
            background: rgba(11, 61, 145, 0.2);
            color: #0b3d91;
        }

        .launch-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-label {
            color: #7080a0;
            font-weight: 500;
        }

        .detail-value {
            color: #64c8ff;
            font-weight: 600;
        }

        .countdown {
            background: rgba(100, 200, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1em;
            color: #64c8ff;
            font-weight: 700;
            margin-top: 12px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #64c8ff;
        }

        .spinner {
            border: 3px solid rgba(100, 200, 255, 0.2);
            border-top-color: #64c8ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-launches {
            text-align: center;
            padding: 40px;
            color: #a0a0c0;
            font-size: 1.1em;
        }

        .error {
            background: rgba(255, 94, 59, 0.1);
            border: 1px solid #ff5e3b;
            color: #ff9999;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .last-updated {
            text-align: center;
            color: #7080a0;
            font-size: 0.9em;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .launches-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Space Launch Tracker</h1>
            <p class="subtitle">NASA & SpaceX - Live Launch Data</p>
        </header>

        <div class="controls">
            <div class="filter-group">
                <label>Filter by:</label>
                <button class="filter-btn active" data-filter="all">All Launches</button>
                <button class="filter-btn" data-filter="upcoming">🔮 Upcoming</button>
                <button class="filter-btn" data-filter="recent">✓ Recent</button>
                <button class="filter-btn" data-filter="spacex">SpaceX</button>
                <button class="filter-btn" data-filter="nasa">NASA</button>
            </div>
            <button id="refreshBtn" style="margin-left: auto;">⟲ Refresh</button>
        </div>

        <div id="error"></div>
        <div id="launches" class="launches-grid">
            <div class="loading">
                <div class="spinner"></div>
                Loading launch data...
            </div>
        </div>

        <div class="last-updated">
            <p>Last updated: <span id="lastUpdate">--:--:--</span></p>
            <p>Auto-refreshing every 60 seconds</p>
        </div>
    </div>

    <script>
        let allLaunches = [];
        let currentFilter = 'all';
        let autoRefreshInterval;

        const launchesContainer = document.getElementById('launches');
        const errorContainer = document.getElementById('error');
        const lastUpdateSpan = document.getElementById('lastUpdate');
        const refreshBtn = document.getElementById('refreshBtn');

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderLaunches();
            });
        });

        // Refresh button
        refreshBtn.addEventListener('click', fetchLaunches);

        // Fetch SpaceX launches
        async function fetchSpaceXLaunches() {
            try {
                const response = await fetch('https://api.spacexdata.com/v4/launches');
                if (!response.ok) throw new Error('SpaceX API failed');
                const data = await response.json();
                
                return data.slice(0, 20).map(launch => {
                    const date = new Date(launch.date_utc);
                    return {
                        id: launch.id,
                        name: launch.name || 'Falcon 9 Launch',
                        rocket: 'Falcon 9',
                        mission: launch.name,
                        launchDate: date,
                        launchDateStr: launch.date_utc,
                        launchSite: launch.pad?.name || 'Unknown Site',
                        success: launch.success,
                        agency: 'SpaceX',
                        flightNumber: launch.flight_number,
                        upcoming: date > new Date(),
                        description: launch.details || 'SpaceX launch mission'
                    };
                });
            } catch (error) {
                console.error('SpaceX API error:', error);
                return [];
            }
        }

        // Fetch NASA launches
        async function fetchNASALaunches() {
            try {
                const response = await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY');
                // Since NASA launch API is restricted, we'll use sample data
                const now = new Date();
                const sampleLaunches = [
                    {
                        id: 'nasa_1',
                        name: 'Artemis II',
                        rocket: 'Space Launch System',
                        mission: 'Artemis II - Moon Mission',
                        launchDate: new Date(now.getTime() + 90 * 24 * 60 * 60 * 1000),
                        launchSite: 'Kennedy Space Center',
                        agency: 'NASA',
                        upcoming: true
                    },
                    {
                        id: 'nasa_2',
                        name: 'James Webb Operations',
                        rocket: 'Ariane 5',
                        mission: 'JWST Mission Support',
                        launchDate: new Date(now.getTime() + 45 * 24 * 60 * 60 * 1000),
                        launchSite: 'Guiana Space Centre',
                        agency: 'NASA',
                        upcoming: true
                    },
                    {
                        id: 'nasa_3',
                        name: 'ISS Resupply',
                        rocket: 'Cygnus',
                        mission: 'ISS Cargo Resupply',
                        launchDate: new Date(now.getTime() + 15 * 24 * 60 * 60 * 1000),
                        launchSite: 'Wallops Flight Facility',
                        agency: 'NASA',
                        upcoming: true
                    }
                ];
                return sampleLaunches;
            } catch (error) {
                console.error('NASA API error:', error);
                return [];
            }
        }

        // Combine and sort launches
        async function fetchLaunches() {
            try {
                errorContainer.innerHTML = '';
                launchesContainer.innerHTML = '<div class="loading"><div class="spinner"></div>Loading launch data...</div>';

                const [spacexLaunches, nasaLaunches] = await Promise.all([
                    fetchSpaceXLaunches(),
                    fetchNASALaunches()
                ]);

                console.log('SpaceX launches:', spacexLaunches.length);
                console.log('NASA launches:', nasaLaunches.length);

                allLaunches = [...spacexLaunches, ...nasaLaunches]
                    .filter(l => l && l.launchDate)
                    .sort((a, b) => a.launchDate - b.launchDate)
                    .slice(0, 40);

                if (allLaunches.length === 0) {
                    errorContainer.innerHTML = '<div class="error">Unable to load launch data. Please refresh the page or check your internet connection.</div>';
                    launchesContainer.innerHTML = '';
                    return;
                }

                updateLastUpdateTime();
                renderLaunches();
            } catch (error) {
                errorContainer.innerHTML = `<div class="error">❌ Error loading launches: ${error.message}</div>`;
                console.error('Fetch error:', error);
            }
        }

        // Filter and render launches
        function renderLaunches() {
            let filtered = allLaunches;
            const now = new Date();

            if (currentFilter === 'upcoming') {
                filtered = allLaunches.filter(l => l.launchDate > now);
            } else if (currentFilter === 'recent') {
                filtered = allLaunches.filter(l => l.launchDate <= now && l.launchDate > new Date(now - 30 * 24 * 60 * 60 * 1000));
            } else if (currentFilter === 'spacex') {
                filtered = allLaunches.filter(l => l.agency === 'SpaceX');
            } else if (currentFilter === 'nasa') {
                filtered = allLaunches.filter(l => l.agency === 'NASA');
            }

            if (filtered.length === 0) {
                launchesContainer.innerHTML = '<div class="no-launches">No launches found</div>';
                return;
            }

            launchesContainer.innerHTML = filtered.map(launch => createLaunchCard(launch)).join('');
        }

        // Create launch card
        function createLaunchCard(launch) {
            const now = new Date();
            const timeUntil = launch.launchDate - now;
            const isUpcoming = timeUntil > 0;
            const statusClass = isUpcoming ? 'status-upcoming' : 'status-recent';
            const agencyClass = launch.agency.toLowerCase();

            let countdownText = '';
            if (isUpcoming) {
                const days = Math.floor(timeUntil / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeUntil % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeUntil % (1000 * 60 * 60)) / (1000 * 60));
                countdownText = `${days}d ${hours}h ${minutes}m`;
            }

            const dateStr = launch.launchDate.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                timeZone: 'UTC'
            });

            return `
                <div class="launch-card ${agencyClass}">
                    <div class="agency ${agencyClass}">${launch.agency}</div>
                    <div class="rocket-name">${launch.name}</div>
                    <div class="mission-name">${launch.mission}</div>
                    <div class="launch-details">
                        <div class="detail-row">
                            <span class="detail-label">🚀 Rocket:</span>
                            <span class="detail-value">${launch.rocket}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">📍 Location:</span>
                            <span class="detail-value">${launch.launchSite}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">📅 Launch Date:</span>
                            <span class="detail-value">${dateStr} UTC</span>
                        </div>
                    </div>
                    ${isUpcoming ? `<div class="countdown">⏱️ ${countdownText}</div>` : ''}
                </div>
            `;
        }

        // Update last update time
        function updateLastUpdateTime() {
            const now = new Date();
            lastUpdateSpan.textContent = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        // Auto-refresh every 60 seconds
        function startAutoRefresh() {
            autoRefreshInterval = setInterval(fetchLaunches, 60000);
        }

        // Initialize
        fetchLaunches();
        startAutoRefresh();
    </script>
</body>
</html>
